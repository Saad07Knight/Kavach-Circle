name: Build S.P.D APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SPD.apk
          cp SPD.apk KavachCircle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SPD-apk
          path: SPD.apk

      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app SPD.apk KavachCircle.apk \
            --title "S.P.D (build ${{ github.run_number }})" \
            --notes "Install this same APK on both phones: the person to protect and the guardian. Android will ask you to allow installing apps from your browser; allow it once." \
            --latest
